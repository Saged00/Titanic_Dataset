<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Titanic Survival Predictor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Montserrat:wght@700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="background-animation">
        <div class="glow-orb" id="orb-1"></div>
        <div class="glow-orb" id="orb-2"></div>
    </div>

    <main class="container">
        <header class="header animate-in">
            <div class="logo">
                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2 20a1 1 0 0 0 1 1h18a1 1 0 0 0 1-1"/><path d="M4 20v-3a4 4 0 0 1 4-4h8a4 4 0 0 1 4 4v3"/><path d="M12 13V3"/><path d="M8 6l4-3 4 3"/></svg>
            </div>
            <h1>Titanic <span>Survival</span></h1>
            <p class="subtitle">Predict your fate aboard the legendary ship</p>
        </header>

        <section class="predictor-card animate-in delay-1" id="predictor-card">
            <form id="prediction-form">
                <div class="form-grid">
                    <!-- Passenger Class -->
                    <div class="input-group">
                        <label for="pclass">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M5 16L3 5l5.5 5L12 4l3.5 6L21 5l-2 11H5z"/><path d="M3.5 21h17a1 1 0 0 0 .83-1.55L19 16H5l-2.33 3.45A1 1 0 0 0 3.5 21z"/></svg>
                            Passenger Class
                        </label>
                        <select id="pclass" name="pclass" required>
                            <option value="1">1st Class</option>
                            <option value="2">2nd Class</option>
                            <option value="3" selected>3rd Class</option>
                        </select>
                    </div>

                    <!-- Sex -->
                    <div class="input-group">
                        <label>
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="8" r="5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M20 21a8 8 0 0 0-16 0" fill="none" stroke="currentColor" stroke-width="2"/></svg>
                            Gender
                        </label>
                        <div class="radio-toggle">
                            <input type="radio" id="male" name="sex" value="male" checked>
                            <label for="male">Male</label>
                            <input type="radio" id="female" name="sex" value="female">
                            <label for="female">Female</label>
                        </div>
                    </div>

                    <!-- Age -->
                    <div class="input-group full-width">
                        <label for="age">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 6v6l4 2"/><circle cx="12" cy="12" r="10"/></svg>
                            Age: <span id="age-val">22</span>
                        </label>
                        <input type="range" id="age" name="age" min="0" max="100" value="22" step="1">
                        <div class="range-labels">
                            <span>0</span>
                            <span>50</span>
                            <span>100</span>
                        </div>
                    </div>

                    <!-- Title -->
                    <div class="input-group">
                        <label for="title">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M20 7h-4V4a1 1 0 0 0-1-1H9a1 1 0 0 0-1 1v3H4a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1h16a1 1 0 0 0 1-1V8a1 1 0 0 0-1-1zM10 5h4v2h-4V5z"/></svg>
                            Passenger Title
                        </label>
                        <select id="title" name="title" required>
                            <option value="Mr" selected>Mr</option>
                            <option value="Mrs">Mrs</option>
                            <option value="Miss">Miss</option>
                            <option value="Master">Master</option>
                            <option value="Rare">Rare</option>
                        </select>
                    </div>

                    <!-- Embarked -->
                    <div class="input-group">
                        <label for="embarked">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
                            Port of Embarkation
                        </label>
                        <select id="embarked" name="embarked" required>
                            <option value="S" selected>Southampton</option>
                            <option value="C">Cherbourg</option>
                            <option value="Q">Queenstown</option>
                        </select>
                    </div>

                    <!-- Family Size -->
                    <div class="input-group">
                        <label>
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                            Family Size
                        </label>
                        <div class="radio-toggle">
                            <input type="radio" id="alone" name="family_size" value="1" checked>
                            <label for="alone">Alone</label>
                            <input type="radio" id="small" name="family_size" value="3">
                            <label for="small">Small (2-4)</label>
                            <input type="radio" id="large" name="family_size" value="6">
                            <label for="large">Large (5+)</label>
                        </div>
                    </div>

                    <!-- Fare -->
                    <div class="input-group full-width">
                        <label for="fare">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
                            Fare: £<span id="fare-val">7.25</span>
                        </label>
                        <input type="range" id="fare" name="fare" min="0" max="520" value="7.25" step="0.25">
                        <div class="range-labels">
                            <span>£0</span>
                            <span>£260</span>
                            <span>£520</span>
                        </div>
                    </div>


                </div>

                <button type="submit" id="predict-btn" class="btn-primary">
                    <span class="btn-text">Predict Fate</span>
                    <svg class="btn-icon" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M13 3v6h8l-12 12v-6H1L13 3z"/></svg>
                    <div class="btn-loader"></div>
                </button>
            </form>
        </section>

        <!-- Result Section -->
        <section id="result-container" class="result-card hidden">
            <div class="result-content">
                <div class="status-icon" id="result-icon">✅</div>
                <h2 id="result-status">Survived!</h2>
                <div class="probability-container">
                    <div class="prob-label">Survival Probability</div>
                    <div class="prob-bar-bg">
                        <div id="prob-bar-fill" class="prob-bar-fill"></div>
                    </div>
                    <div id="prob-value" class="prob-percentage">85%</div>
                </div>
                <div id="input-summary" class="input-summary"></div>
                <button id="reset-btn" class="btn-secondary">New Prediction</button>
            </div>
        </section>
    </main>

    <footer class="footer">
        <p>&copy; 2026 Titanic AI · XGBoost</p>
    </footer>

    <div id="toast" class="toast" role="alert" aria-live="polite"></div>

    <script src="/static/script.js"></script>
</body>
</html>
